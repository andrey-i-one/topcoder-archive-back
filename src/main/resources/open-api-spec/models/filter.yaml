FilterDTO:
  type: object
  required:
    - matchMode
    - field
    - operator
    - value
  properties:
    matchMode:
      type: string
      enum: [anyOf, contains, notContains, startsWith, endsWith, notEquals, equals, lt, lto, gt, gto]
    field:
      type: string
    operator:
      type: string
      enum: [and, or]
    value:
      type: string
  example: "[
        {
          \"field\": \"аббревиатура\",
          \"operator\": \"and\",
          \"matchMode\": \"equals\",
          \"value\": \"Запись 1\"
        }
      ]"