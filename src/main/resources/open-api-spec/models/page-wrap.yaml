components:
  schemas:
    PageInfo:
      type: object
      description: Объект с информацией по страничному отображению
      properties:
        totalElements:
          type: integer
          format: int64
          description: общее количество элементов
        totalPages:
          type: integer
          format: integer
          description: Общее количество страниц
        number:
          type: integer
          format: integer
          description: Текущая страница
        numberOfElements:
          type: integer
          format: integer
          description: Количество элементов