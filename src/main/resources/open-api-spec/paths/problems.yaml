description: ''
summary: ''
get:
  summary: ''
  operationId: retrieveProblems
  tags:
    - Problems
  parameters:
    - name: page
      in: query
      description: Номер страницы для запроса
      required: false
      schema:
        type: integer
        default: 0
    - name: perPage
      in: query
      description: Количество элементов на одной странице
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
    - name: sortField
      in: query
      description: Поле сортировки
      required: false
      schema:
        type: string
        default: id
    - name: sortOrder
      in: query
      description: Направление сортировки
      required: false
      schema:
        type: string
        enum: [ ASC, DESC ]
        default: ASC
    - name: tags
      in: query
      description: Тэги
      required: false
      schema:
        type: string
    - name: div1Level
      in: query
      description: Уровень дивизиона 1
      required: false
      schema:
        type: string
    - name: div2Level
      in: query
      description: Уровень дивизиона 2
      required: false
      schema:
        type: string
  responses:
    '200':
      description: ''
      content:
        application/json:
          schema:
            $ref: '../dto/problem.yaml#/components/schemas/ProblemsPageDto'
    '500':
      $ref: '../models/500.yaml'
    '422':
      $ref: '../models/422.yaml'
    '400':
      $ref: '../models/400.yaml'
    '403':
      $ref: '../models/403.yaml'
    '401':
      $ref: '../models/401.yaml'